<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Bumpinto World 인프라 후원 안내</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
      background: linear-gradient(160deg, #091326, #1b3158);
      color: #122033;
    }
    .card {
      width: min(400px, 100%);
      background: #fffdf9;
      border-radius: 22px;
      padding: 24px 20px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      text-align: center;
      border: 2px solid rgba(245, 162, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: #d4003b;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 900;
      color: #122033;
    }
    .sub {
      margin: 6px 0 18px;
      font-size: 13.5px;
      line-height: 1.45;
      color: #485870;
      font-weight: 600;
    }
    .acc-box {
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      padding: 16px 14px;
      margin-bottom: 14px;
    }
    .bank {
      font-size: 14px;
      font-weight: 800;
      color: #008485;
    }
    .num {
      display: block;
      margin: 6px 0;
      font-size: 22px;
      font-weight: 900;
      color: #122033;
      letter-spacing: 0.02em;
    }
    .holder {
      font-size: 13.5px;
      font-weight: 700;
      color: #475569;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: 0;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      margin-top: 8px;
    }
    .btn.primary {
      background: #0064ff;
      color: #fff;
    }
    .btn.copy {
      background: #122033;
      color: #fff;
    }
    .btn.copy.done {
      background: #20c997;
      color: #082019;
    }
    .foot {
      margin: 14px 0 0;
      font-size: 12px;
      color: #64748b;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">☕ Bumpinto World 인프라 후원</span>
    <h1>무료 오픈월드 서버 응원하기</h1>
    <p class="sub">보내주신 커피 한 잔은 100% 월드 운영 및 신규 동네 확장 인프라 비용으로 사용됩니다 ♥</p>
    <div class="acc-box">
      <div class="bank">하나은행</div>
      <strong class="num" id="acc-text">567-910439-84207</strong>
      <div class="holder">예금주: 범프인투</div>
    </div>
    <a class="btn primary" href="supertoss://send?bank=%ED%95%98%EB%82%98%EC%9D%80%ED%96%89&accountNo=56791043984207">
      💸 토스(Toss) 앱으로 바로 송금하기
    </a>
    <button type="button" class="btn copy" id="copy-btn">
      📋 계좌번호 복사하기 (모바일 뱅킹/카뱅/페이용)
    </button>
    <p class="foot">계좌번호를 복사한 뒤 사용하시는 은행 앱이나 카카오페이를 열면 바로 붙여넣기 송금이 가능합니다.</p>
  </main>
  <script>
    const btn = document.getElementById('copy-btn');
    btn.addEventListener('click', async () => {
      const raw = '하나은행 56791043984207';
      try {
        await navigator.clipboard.writeText(raw);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = raw;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      btn.classList.add('done');
      btn.textContent = '✅ 하나은행 56791043984207 복사 완료!';
      setTimeout(() => {
        btn.classList.remove('done');
        btn.textContent = '📋 계좌번호 복사하기 (모바일 뱅킹/카뱅/페이용)';
      }, 2800);
    });
  </script>
</body>
</html>
