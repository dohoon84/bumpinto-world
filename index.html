<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Bumpinto World</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="in-gate">
  <div id="app"></div>
  <div id="overlay"></div>
  <div id="hud">
    <div class="help">WASD/방향키 이동 · Shift 달리기 · 마우스 드래그로 위·아래·좌·우 · 휠 줌 · Enter 채팅 · M 위에서 보기 · E 카카오바이크 · 정류장 근처에 가면 도착 정보</div>
    <div class="clock" id="hud-clock">--:--</div>
  </div>
  <div id="buttons">
    <button id="btn-view" title="M">🗺️ 위에서 보기</button>
    <button id="btn-home" title="H">🚇 역으로</button>
    <button id="btn-leave" type="button" hidden>나가기</button>
  </div>
  <form id="chat" autocomplete="off">
    <input id="chat-input" maxlength="80" placeholder="말 걸기 (Enter) — 근처 사람에게만 보여요" />
    <button id="chat-log-toggle" type="button" title="주변 대화 전체보기 열기/닫기" aria-expanded="false">
      <span>💬 전체보기</span>
      <span id="chat-unread" class="chat-unread" hidden>0</span>
    </button>
  </form>
  <button id="ride-btn" type="button" hidden>🚲 카카오바이크 타기 (E)</button>
  <div id="chat-log-panel" hidden></div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="presence-status" role="button" tabindex="0" title="클릭하여 접속자 위치 및 목록 보기"></div>
  <div id="presence-panel" hidden></div>
  <button id="board-Launcher" class="board-launcher" type="button" aria-label="커뮤니티 게시판 열기">
    <span class="board-icon">📋</span>
    <span class="board-label">게시판</span>
  </button>
  <button id="contribute-launcher" class="board-launcher contribute-launcher" type="button" aria-label="함께 만들기 및 명예의 전당 열기">
    <span class="board-icon">🌍</span>
    <span class="board-label">함께 만들기</span>
  </button>
  <div id="board-modal" hidden></div>
  <div id="stop-panel"></div>
  <div id="handset">
    <div class="shell">
      <span class="side vol"></span>
      <span class="side power"></span>
      <div class="glass">
        <div class="island"></div>
        <div class="status"><span id="handset-time">--:--</span><span class="radios" aria-hidden="true"></span></div>
        <div id="handset-body"></div>
        <button type="button" class="home" aria-label="휴대폰 홈"></button>
      </div>
    </div>
  </div>
  <div id="phone">
    <div class="bezel">
      <div class="ear"></div>
      <div id="phone-screen">
        <canvas id="phone-map" aria-label="소형맵"></canvas>
      </div>
    </div>
  </div>
  <div id="pc-only" hidden>
    <div class="pc-only-card">
      <p class="pc-only-kicker">PC BROWSER ONLY</p>
      <h1>Bumpinto World</h1>
      <p>3D 오픈월드 탐험과 멀티플레이는 <b>PC 브라우저</b>에서 진행할 수 있습니다.<br>PC에서 <b>bumpinto.world</b>로 접속해 주세요!</p>
      <div class="pc-only-actions">
        <button type="button" class="pc-only-btn primary" data-pc-only-copy="1">🔗 PC에서 열기 위해 주소 복사</button>
        <a href="https://github.com/dohoon84/bumpinto-world" target="_blank" rel="noopener" class="pc-only-btn">⭐ GitHub 오픈소스 구경하기</a>
        <button type="button" class="pc-only-btn sub" data-pc-only-close="1">🌏 지구본으로 돌아가기</button>
      </div>
    </div>
  </div>
  <div id="world-gate"></div>
  <div id="lobby"></div>
  <div id="attribution">© <a href="https://crazylabs.co.kr" target="_blank" rel="noopener">CrazyLabs</a> · <a href="https://github.com/dohoon84/bumpinto-world" target="_blank" rel="noopener">소스 공개 (영리 서비스 금지)</a> · 지도 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> (ODbL)</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
